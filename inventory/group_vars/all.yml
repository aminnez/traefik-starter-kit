---
# ==============================================================================
# Dynamic Configuration Variables
# Resolves in order of priority:
#   1. Ansible Vault (e.g. vault_traefik_* or vault.yml)
#   2. Local .env file (looked up via ansible.builtin.ini)
#   3. System / CI Environment variables (lookup('ansible.builtin.env', ...))
# ==============================================================================

# Required Base Domain & ACME settings
traefik_base_domain: "{{ vault_traefik_base_domain | default(lookup('ansible.builtin.ini', 'TRAEFIK_BASE_DOMAIN type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_BASE_DOMAIN', default=''), true) | trim }}"
traefik_acme_email: "{{ vault_traefik_acme_email | default(lookup('ansible.builtin.ini', 'TRAEFIK_ACME_EMAIL type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_ACME_EMAIL', default=''), true) | trim }}"

# Traefik Dashboard Authentication
traefik_dashboard_user: "{{ vault_traefik_dashboard_user | default(lookup('ansible.builtin.ini', 'TRAEFIK_DASHBOARD_USER type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_DASHBOARD_USER', default=''), true) | default('admin', true) | trim }}"
traefik_dashboard_password: "{{ vault_traefik_dashboard_password | default(lookup('ansible.builtin.ini', 'TRAEFIK_DASHBOARD_PASSWORD type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_DASHBOARD_PASSWORD', default=''), true) | trim }}"

# Optional Subdomain Override
traefik_dashboard_subdomain: "{{ vault_traefik_dashboard_subdomain | default(lookup('ansible.builtin.ini', 'TRAEFIK_DASHBOARD_SUBDOMAIN type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_DASHBOARD_SUBDOMAIN', default=''), true) | default('traefik', true) | trim }}"

# ACME DNS Challenge Settings
traefik_acme_challenge_type: "{{ vault_traefik_acme_challenge_type | default(lookup('ansible.builtin.ini', 'TRAEFIK_ACME_CHALLENGE_TYPE type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_ACME_CHALLENGE_TYPE', default=''), true) | default('http', true) | trim }}"
traefik_cf_dns_api_token: "{{ vault_cf_dns_api_token | default(lookup('ansible.builtin.ini', 'CF_DNS_API_TOKEN type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'CF_DNS_API_TOKEN', default=''), true) | trim }}"
traefik_acme_wildcard_enabled: "{{ vault_traefik_acme_wildcard_enabled | default(lookup('ansible.builtin.ini', 'TRAEFIK_ACME_WILDCARD_ENABLED type=properties file=.env', errors='ignore', default=''), true) | default(lookup('ansible.builtin.env', 'TRAEFIK_ACME_WILDCARD_ENABLED', default=''), true) | default(false, true) | bool }}"
