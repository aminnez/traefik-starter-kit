---
- name: Ensure Traefik installation and acme directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ traefik_install_dir }}"
    - "{{ traefik_install_dir }}/acme"

- name: Ensure acme.json exists with strict permissions
  ansible.builtin.file:
    path: "{{ traefik_install_dir }}/acme/acme.json"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Ensure external Traefik Docker network exists
  ansible.builtin.command:
    cmd: "docker network create {{ traefik_network_name }}"
  register: create_network_result
  failed_when: false
  changed_when: create_network_result.rc == 0

- name: Generate dashboard auth password hash
  ansible.builtin.set_fact:
    traefik_dashboard_auth_hash: "{{ traefik_dashboard_password | password_hash('blowfish') }}"
  when: traefik_dashboard_auth_hash is not defined

- name: Deploy traefik.yml static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_install_dir }}/traefik.yml"
    mode: '0644'
  notify: Restart traefik stack

- name: Deploy docker-compose.yml stack configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_install_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart traefik stack

- name: Deploy and start Traefik container stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ traefik_install_dir }}"
  register: compose_up_result
  changed_when: "'Started' in compose_up_result.stdout or 'Created' in compose_up_result.stdout"
